<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b1a" />
    <meta
      name="description"
      content="StudyBoard — study together in real time with a shared whiteboard, chat, PDFs, math tools and voice."
    />
    <title>StudyBoard</title>
  </head>
  <body>
    <!--
      This fallback lives inside #root, so React replaces it on mount. If the
      app's JavaScript fails to load or execute, it stays on screen instead of
      leaving the user staring at a blank page.
    -->
    <div id="root">
      <div
        style="
          min-height: 100vh;
          display: grid;
          place-items: center;
          padding: 2rem;
          background: #070b1a;
          color: #e9ecfc;
          font-family: Inter, system-ui, sans-serif;
          text-align: center;
        "
      >
        <div style="max-width: 32rem">
          <p style="margin: 0 0 0.5rem; font-size: 1.05rem; font-weight: 600">
            Loading StudyBoard…
          </p>
          <p style="margin: 0; color: #b2b8d6; font-size: 0.9rem">
            If this message stays on screen, the app's JavaScript did not load.
            Open the browser console for the error.
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
