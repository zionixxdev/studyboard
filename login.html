<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sign in — StudyBoard</title>
<meta name="description" content="Sign in to StudyBoard." />
<meta name="theme-color" content="#0ea5a4" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html" aria-label="StudyBoard home">
    <span class="logo" aria-hidden="true">S</span> StudyBoard
  </a>
  <span class="spacer"></span>
  <button class="btn sm icon" id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">◐</button>
</header>

<main class="wrap-narrow">
  <div id="authMount" class="auth-page-host"></div>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module">
  import * as auth from "./js/auth.js";
  import { showAuthGate, authGateHandlers } from "./js/auth-ui.js";
  import { initTheme, registerServiceWorker } from "./js/ui.js";

  initTheme();
  registerServiceWorker();

  (async () => {
    const next = new URLSearchParams(location.search).get("next");
    const urlState = auth.initialUrlState();

    // Already signed in and not here to reset a password? Go straight in.
    const user = await auth.requireSession();
    if (user && urlState?.type !== "recovery") {
      location.replace(next || "index.html");
      return;
    }

    showAuthGate({
      ...authGateHandlers(auth, {
        recovery: urlState?.type === "recovery",
        error: urlState?.error || null,
        next,
      }),
      mount: document.getElementById("authMount"),
      mode: "signin",
    });
  })();
</script>
</body>
</html>
